[package]
name = "knit-md-docx-rs"
version = "0.4.20"
authors = [
  "bokuweb <bokuweb12@gmail.com>",
  "danganhtu01 <admin@atdang.com>",
]
repository = "https://github.com/danganhtu01/knit-md-docx-rs"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "A .docx writer (fork of docx-rs) with native OMML/oMath equations, run-level super/subscript, and paragraph borders for thematic breaks."
keywords = [
  "office",
  "word",
  "docx",
  "omml",
]

# The `emf` feature was dropped for the crates.io release because it relied on
# git-only dependencies (emf-core, wmf-core). The cfg-gated code remains dormant
# so the feature can be restored if those crates are published to a registry.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("emf"))'] }

[lib]
name = "docx_rs"
path = "src/lib.rs"

[features]
default = ["image"]
wasm = ["wasm-bindgen", "ts-rs", "image"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2.0.12"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = {version = "1.0.142" }
base64 = "0.22.1"
image = { version = "0.25.6", default-features = false, features=["gif", "jpeg", "png", "bmp", "tiff"], optional = true }
wasm-bindgen = { version = "0.2.92", optional = true }
ts-rs = { version = "6.1", optional = true }
quick-xml = { version = "0.36", default-features = false, features = ["encoding"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
insta = "1.43.1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "read_docx"
harness = false

[[bench]]
name = "write_docx"
harness = false
